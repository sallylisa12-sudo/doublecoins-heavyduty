<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sign In - Double Coin Heavy Duty Truck Warehouse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .auth-page{min-height:60vh;padding:56px 0;background:#f7f7f7}.auth-card{max-width:460px;margin:auto;padding:34px;background:#fff;border:1px solid #e4e4e4;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.auth-card h1{text-align:center;font-size:26px;margin-bottom:6px}.auth-card>p{text-align:center;color:#666;margin-bottom:26px}.auth-field{display:block;margin:16px 0 6px;font-size:13px;font-weight:700}.auth-card input{width:100%;padding:12px;border:1px solid #ccc;border-radius:4px;font:inherit}.auth-card button{width:100%;margin-top:22px;border:0}.auth-links{display:flex;justify-content:space-between;margin-top:18px;font-size:13px}.auth-links a{color:#d60000}.auth-note{text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid #eee;color:#666;font-size:13px}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main class="auth-page"><div class="container"><section class="auth-card">
    <h1>Welcome Back</h1><p>Sign in to manage your orders and account.</p>
    <form onsubmit="signIn(event)">
      <label class="auth-field" for="email">Email Address</label><input id="email" type="email" required autocomplete="email" />
      <label class="auth-field" for="password">Password</label><input id="password" type="password" required autocomplete="current-password" />
      <button class="btn-add-cart" type="submit">SIGN IN</button>
    </form>
    <div class="auth-links"><a href="#" onclick="showToast('Password-reset support is coming soon.');return false;">Forgot password?</a><a href="membership.html">Create an account</a></div>
    <p class="auth-note">New here? Join the Double Coin Heavy Duty Truck Warehouse membership program for exclusive savings.</p>
  </section></div></main>
  <div id="site-footer"></div>
  <script src="components.js"></script><script src="products.generated.js"></script><script src="products.js"></script><script src="script.js"></script>
  <script>function signIn(e){ return signInUser(e); }</script>
</body>
</html>
