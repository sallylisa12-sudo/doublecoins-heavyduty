<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>All Brands - Double Coin Heavy Duty Truck Warehouse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .brand-full-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:48px;}
    .brand-full-card{border:1px solid #e0e0e0;border-radius:8px;padding:28px 20px;text-align:center;background:#fff;transition:all .2s;cursor:pointer;}
    .brand-full-card:hover{border-color:#e60000;box-shadow:0 4px 16px rgba(230,0,0,0.1);transform:translateY(-2px);}
    .brand-full-card .brand-logo-text{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
    .brand-full-card .brand-logo{display:block;width:150px;height:46px;object-fit:contain;margin:0 auto 8px;}
    .brand-full-card .brand-count{font-size:12px;color:#999;}
    .brand-full-card .brand-letter{font-size:12px;font-weight:700;color:#e60000;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
    .alpha-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px;}
    .alpha-btn{width:34px;height:34px;border:1px solid #ddd;background:#fff;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
    .alpha-btn:hover,.alpha-btn.active{background:#e60000;color:#fff;border-color:#e60000;}
    .brand-group-title{font-size:13px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;padding:12px 0 8px;border-bottom:2px solid #e0e0e0;margin-bottom:16px;}
    @media(max-width:900px){.brand-full-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:600px){.brand-full-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
    @media(max-width:480px){
      .brand-full-card{padding:18px 12px;}
      .brand-full-card .brand-logo-text{font-size:16px;}
      .alpha-bar{gap:4px;}
      .alpha-btn{width:30px;height:30px;font-size:12px;}
    }
  </style>
</head>
<body>
<div id="site-header"></div>
<div class="page-header-section" style="background:#1a1a1a;color:#fff;padding:36px 0">
  <div class="container">
    <h1 style="font-size:28px;font-weight:700">All Tire Brands</h1>
    <p style="color:#aaa;margin-top:6px;font-size:14px">Shop from 12+ major commercial truck tire brands</p>
  </div>
</div>
<div class="section" style="padding:40px 0 60px">
  <div class="container">
    <div class="alpha-bar" id="alphaBar"></div>
    <div id="brandsContainer"></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="components.js"></script>
<script src="products.generated.js"></script><script src="products.js"></script>

<script src="script.js"></script>
<script>
const ALL_BRANDS = [
  { name:'Arisun', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h6a/hf4/9503592415262/arisun-tires-logo.webp', desc:'Value-priced commercial truck tires with solid performance.' },
  { name:'Continental', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h0b/haa/9503592185886/continental-logo.webp', desc:'Premium German engineering for long haul and regional operations.' },
  { name:'Cooper', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h82/h4f/9503592251422/cooper-logo.webp', desc:'Work series tires designed for medium duty trucks and fleets.' },
  { name:'Double Coin', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h3b/h61/9503592513566/double-coin-logo.webp', desc:'High-value commercial tires with excellent cost per mile.' },
  { name:'Fortune', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/hd1/hb0/9503592546334/fortune-logo.webp', desc:'Budget-friendly commercial truck tires for highway operations.' },
  { name:'Goodride', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h73/h01/9503592611870/goodride-logo.webp', desc:'Reliable all-weather tires for commercial truck fleets.' },
  { name:'Goodyear', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h52/hf2/9503592218654/goodyear-logo.webp', desc:'America\'s #1 commercial truck tire brand for 125+ years.' },
  { name:'Hankook', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/hb1/had/9503592284190/hankook-logo.webp', desc:'Innovative Korean tire technology for long haul efficiency.' },
  { name:'Hercules', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h38/h5c/9503592742942/hercules-logo.webp', desc:'Tough commercial tires built for demanding conditions.' },
  { name:'Ironman', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/ha2/h0c/9503592775710/ironman-tires-logo.webp', desc:'Performance truck tires at competitive prices.' },
  { name:'Milestar', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/h71/h9e/9503592808478/milestar-logo.webp', desc:'Specialty trailer and light truck tires.' },
  { name:'Toyo', image:'https://www.tires-easy-truck.com/medias/sys_master/images/images/he9/hb2/9503592349726/toyo-logo.webp', desc:'Premium Japanese engineering for superior tread life and comfort.' },
];

function initPage() {
  const groups = {};
  ALL_BRANDS.forEach(b => {
    const l = b.name[0].toUpperCase();
    if (!groups[l]) groups[l] = [];
    groups[l].push(b);
  });

  const letters = Object.keys(groups).sort();
  document.getElementById('alphaBar').innerHTML = letters.map(l =>
    `<button class="alpha-btn" onclick="scrollToLetter('${l}')">${l}</button>`
  ).join('');

  let html = '';
  letters.forEach(letter => {
    html += `<div id="letter-${letter}">
      <div class="brand-group-title">${letter}</div>
      <div class="brand-full-grid">
        ${groups[letter].map(b => {
          const count = PRODUCTS.filter(p=>p.brand===b.name).length;
          return `<a href="tires.html?brand=${encodeURIComponent(b.name)}" class="brand-full-card">
            <img src="${b.image}" class="brand-logo" alt="${b.name}" onerror="this.outerHTML='<div class=\\'brand-logo-text\\'>${b.name}</div>'" />
            <p style="font-size:12px;color:#777;margin:6px 0 10px;line-height:1.5">${b.desc}</p>
            <div class="brand-count">${count} product${count!==1?'s':''}</div>
          </a>`;
        }).join('')}
      </div>
    </div>`;
  });
  document.getElementById('brandsContainer').innerHTML = html;
}

function scrollToLetter(l) {
  document.getElementById('letter-'+l)?.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
