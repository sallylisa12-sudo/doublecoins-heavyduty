<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Shop Tires - Double Coin Heavy Duty Truck Warehouse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .page-layout { display: flex; gap: 28px; align-items: flex-start; }
    .filters-sidebar { width: 240px; flex-shrink: 0; position: sticky; top: 80px; }
    .filter-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .filter-title { padding: 14px 16px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: #f5f5f5; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; cursor: pointer; }
    .filter-body { padding: 14px 16px; }
    .filter-option { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer; font-size: 13px; }
    .filter-option input { cursor: pointer; accent-color: #e60000; }
    .filter-option label,.filter-option span { cursor: pointer; flex: 1; }
    .filter-option .count { color: #999; font-size: 12px; }
    .price-range-inputs { display: flex; gap: 8px; align-items: center; }
    .price-range-inputs input { width: 80px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    .price-range-inputs span { color: #999; }
    .apply-filter { margin-top: 12px; width: 100%; padding: 9px; background: #1a1a1a; color: #fff; border: none; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .apply-filter:hover { background: #e60000; }
    .products-main { flex: 1; min-width: 0; }
    .results-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 12px 16px; background: #f5f5f5; border-radius: 6px; }
    .results-count { font-size: 14px; color: #666; }
    .sort-select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-family: 'Poppins', sans-serif; }
    .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filter-tag { background: #1a1a1a; color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 14px; display: flex; align-items: center; gap: 6px; }
    .filter-tag span { cursor: pointer; opacity: 0.7; } .filter-tag span:hover { opacity: 1; }
    .breadcrumb { font-size: 13px; color: #999; margin-bottom: 20px; }
    .breadcrumb a { color: #e60000; }
    .breadcrumb a:hover { text-decoration: underline; }
    #productsGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .no-results { text-align: center; padding: 60px 20px; color: #999; }
    .no-results svg { margin-bottom: 16px; }
    .no-results h3 { font-size: 18px; color: #333; margin-bottom: 8px; }
    .page-header-section { background: #1a1a1a; color: #fff; padding: 36px 0; margin-bottom: 0; }
    .page-header-section h1 { font-size: 28px; font-weight: 700; }
    .page-header-section p { color: #aaa; font-size: 14px; margin-top: 6px; }
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 36px; }
    .page-btn { width: 38px; height: 38px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .page-btn.active { background: #e60000; color: #fff; border-color: #e60000; }
    .page-btn:hover:not(.active) { border-color: #e60000; color: #e60000; }
    .filter-toggle{display:none;width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px;text-align:center;}
    .filter-toggle:hover{background:#e60000;}
    @media(max-width:900px){ .page-layout{flex-direction:column;} .filters-sidebar{width:100%;position:static;} #productsGrid{grid-template-columns:repeat(2,1fr);gap:14px;} }
    @media(max-width:768px){ #productsGrid{grid-template-columns:1fr;gap:12px;} }
    @media(max-width:768px){
      .filter-toggle{display:block;}
      .filters-sidebar{display:none;}
      .filters-sidebar.open{display:block;}
      .results-bar{flex-direction:column;gap:10px;align-items:stretch;}
      .sort-select{width:100%;}
      .page-header-section h1{font-size:22px;}
      .page-header-section p{font-size:13px;}
    }
    @media(max-width:580px){ /* handled by 768px breakpoint above */ }
  </style>
</head>
<body>
<div id="site-header"></div>

<!-- Page Header -->
<div class="page-header-section">
  <div class="container">
    <h1 id="pageTitle">All Commercial Truck Tires</h1>
    <p id="pageSubtitle">Find the right tire for your truck from top brands</p>
  </div>
</div>

<div class="section" style="padding:36px 0 60px">
  <div class="container">

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="index.html">Home</a> &rsaquo; <a href="tires.html">Tires</a> &rsaquo; <span id="breadCrumbCat">All Tires</span>
    </div>

    <div class="page-layout">
      <!-- Mobile filter toggle -->
      <button class="filter-toggle" onclick="document.querySelector('.filters-sidebar').classList.toggle('open');this.textContent=this.textContent.includes('Show')?'Hide Filters':'Show Filters'">Show Filters</button>

      <!-- SIDEBAR FILTERS -->
      <aside class="filters-sidebar">

        <div class="filter-card">
          <div class="filter-title">Category</div>
          <div class="filter-body" id="categoryFilters"></div>
        </div>

        <div class="filter-card">
          <div class="filter-title">Brand</div>
          <div class="filter-body" id="brandFilters"></div>
        </div>

        <div class="filter-card">
          <div class="filter-title">Price Range</div>
          <div class="filter-body">
            <div class="price-range-inputs">
              <input type="number" id="minPrice" placeholder="$0" min="0"/>
              <span>to</span>
              <input type="number" id="maxPrice" placeholder="$600" min="0"/>
            </div>
            <button class="apply-filter" onclick="applyFilters()">Apply</button>
          </div>
        </div>

        <div class="filter-card">
          <div class="filter-title">Tire Size</div>
          <div class="filter-body">
            <div style="display:flex;flex-direction:column;gap:8px;">
              <input type="text" id="sizeFilter" placeholder="e.g. 295/75R22.5" style="padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px;width:100%"/>
              <button class="apply-filter" onclick="applyFilters()">Search Size</button>
            </div>
          </div>
        </div>

        <button class="apply-filter" onclick="clearFilters()" style="background:#f5f5f5;color:#333;width:100%;padding:10px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-size:13px;">Clear All Filters</button>
      </aside>

      <!-- MAIN PRODUCT AREA -->
      <div class="products-main">
        <div class="active-filters" id="activeTags"></div>
        <div class="results-bar">
          <span class="results-count" id="resultsCount">0 products found</span>
          <select class="sort-select" id="sortSelect" onchange="applyFilters()">
            <option value="">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Best Rated</option>
            <option value="name">Name A-Z</option>
          </select>
        </div>
        <div id="productsGrid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="components.js"></script>
<script src="products.generated.js"></script><script src="products.js"></script>

<script src="script.js"></script>
<script>
const BRANDS = [...new Set(PRODUCTS.map(p => p.brand))].sort();
const PER_PAGE = 12;
let currentPage = 1;

function initPage() {
  const categoryLabels = {
    'all-position': 'Commercial Truck - All Position',
    drive: 'Commercial Truck - Drive',
    steer: 'Commercial Truck - Steer',
    trailer: 'Commercial Truck - Trailer',
    rv: 'Motorhome / RV'
  };
  const categories = [...new Set(PRODUCTS.map(p => p.cat))].filter(Boolean).sort();
  document.getElementById('categoryFilters').innerHTML = [
    `<label class="filter-option"><input type="radio" name="cat" value="" checked onchange="applyFilters()"><span>All Products (${PRODUCTS.length})</span></label>`,
    ...categories.map(cat => `<label class="filter-option"><input type="radio" name="cat" value="${cat}" onchange="applyFilters()"><span>${categoryLabels[cat] || cat} (${PRODUCTS.filter(p => p.cat === cat).length})</span></label>`)
  ].join('');

  // Build brand checkboxes
  const bf = document.getElementById('brandFilters');
  bf.innerHTML = BRANDS.map(b => `
    <label class="filter-option">
      <input type="checkbox" name="brand" value="${b}" onchange="applyFilters()">
      <label>${b}</label>
      <span class="count">(${PRODUCTS.filter(p=>p.brand===b).length})</span>
    </label>`).join('');

  // Pre-select from URL
  const cat = getParam('cat');
  const brand = getParam('brand');
  const q = getParam('q');
  const width = getParam('width');
  const ratio = getParam('ratio');
  const diameter = getParam('diameter');

  if (cat) {
    const el = document.querySelector(`input[name="cat"][value="${cat}"]`);
    if (el) el.checked = true;
  }
  if (brand) {
    const el = document.querySelector(`input[name="brand"][value="${brand}"]`);
    if (el) el.checked = true;
  }
  if (q) document.getElementById('sizeFilter').value = q;
  if (width && ratio && diameter) document.getElementById('sizeFilter').value = `${width}/${ratio}R${diameter}`;

  applyFilters();
}

function applyFilters() {
  currentPage = 1;
  renderProducts();
}

function clearFilters() {
  document.querySelectorAll('input[name="cat"]')[0].checked = true;
  document.querySelectorAll('input[name="brand"]').forEach(cb => cb.checked = false);
  document.getElementById('minPrice').value = '';
  document.getElementById('maxPrice').value = '';
  document.getElementById('sizeFilter').value = '';
  document.getElementById('sortSelect').value = '';
  applyFilters();
}

function getFilters() {
  const cat = document.querySelector('input[name="cat"]:checked')?.value || '';
  const brands = [...document.querySelectorAll('input[name="brand"]:checked')].map(cb => cb.value);
  const maxPrice = document.getElementById('maxPrice')?.value;
  const minPrice = document.getElementById('minPrice')?.value;
  const sizeQ = document.getElementById('sizeFilter')?.value.trim();
  const sort = document.getElementById('sortSelect')?.value;
  return { cat, brands, maxPrice, minPrice, sizeQ, sort };
}

function renderProducts() {
  const { cat, brands, maxPrice, minPrice, sizeQ, sort } = getFilters();

  let list = [...PRODUCTS];
  if (cat) list = list.filter(p => p.cat === cat);
  if (brands.length) list = list.filter(p => brands.includes(p.brand));
  if (maxPrice) list = list.filter(p => p.price <= parseFloat(maxPrice));
  if (minPrice) list = list.filter(p => p.price >= parseFloat(minPrice));
  if (sizeQ) {
    const q = sizeQ.toLowerCase().replace(/[^a-z0-9.]/g,'');
    list = list.filter(p => {
      const s = (p.brand + ' ' + p.name + ' ' + p.size).toLowerCase().replace(/[^a-z0-9.]/g,'');
      return s.includes(q);
    });
  }
  if (sort === 'price-asc') list.sort((a,b) => a.price - b.price);
  else if (sort === 'price-desc') list.sort((a,b) => b.price - a.price);
  else if (sort === 'rating') list.sort((a,b) => b.stars - a.stars);
  else if (sort === 'name') list.sort((a,b) => (a.brand+a.name).localeCompare(b.brand+b.name));

  // Update breadcrumb/title
  const catNames = { 'all-position':'All Position', drive:'Drive', steer:'Steer', trailer:'Trailer', rv:'Motorhome / RV' };
  document.getElementById('breadCrumbCat').textContent = cat ? catNames[cat] || cat : 'All Tires';
  document.getElementById('pageTitle').textContent = cat ? `Commercial Truck ${catNames[cat]||cat} Tires` : 'All Commercial Truck Tires';

  // Active filter tags
  const tags = [];
  if (cat) tags.push({ label: catNames[cat]||cat, key:'cat' });
  brands.forEach(b => tags.push({ label: b, key:'brand:'+b }));
  if (maxPrice) tags.push({ label: 'Max $'+maxPrice, key:'maxPrice' });
  if (sizeQ) tags.push({ label: sizeQ, key:'sizeQ' });
  document.getElementById('activeTags').innerHTML = tags.map(t =>
    `<div class="filter-tag">${t.label} <span onclick="removeTag('${t.key}')">×</span></div>`
  ).join('');

  // Pagination
  const total = list.length;
  const pages = Math.ceil(total / PER_PAGE);
  const paged = list.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

  document.getElementById('resultsCount').textContent = `${total} product${total!==1?'s':''} found`;

  const grid = document.getElementById('productsGrid');
  if (!paged.length) {
    grid.innerHTML = `<div class="no-results" style="grid-column:1/-1">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <h3>No tires found</h3>
      <p>Try adjusting your filters or search term.</p>
    </div>`;
  } else {
    grid.innerHTML = paged.map(p => productCardHTML(p)).join('');
  }

  // Pagination buttons
  const pagEl = document.getElementById('pagination');
  if (pages <= 1) { pagEl.innerHTML = ''; return; }
  pagEl.innerHTML = Array.from({length: pages}, (_,i) =>
    `<button class="page-btn${i+1===currentPage?' active':''}" onclick="goPage(${i+1})">${i+1}</button>`
  ).join('');
}

function goPage(n) { currentPage = n; renderProducts(); window.scrollTo(0,0); }

function removeTag(key) {
  if (key === 'cat') document.querySelectorAll('input[name="cat"]')[0].checked = true;
  else if (key.startsWith('brand:')) {
    const el = document.querySelector(`input[name="brand"][value="${key.slice(6)}"]`);
    if (el) el.checked = false;
  } else if (key === 'maxPrice') document.getElementById('maxPrice').value = '';
  else if (key === 'sizeQ') document.getElementById('sizeFilter').value = '';
  applyFilters();
}
</script>
</body>
</html>
