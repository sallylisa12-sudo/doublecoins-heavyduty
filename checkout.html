<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Checkout - Double Coin Heavy Duty Truck Warehouse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .checkout-layout{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:flex-start;}
    .checkout-section{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:20px;}
    .checkout-section h2{font-size:16px;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;}
    .step-num{background:#e60000;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .form-row.single{grid-template-columns:1fr;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group label{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.4px;}
    .form-group input,.form-group select{padding:11px 13px;border:1px solid #ddd;border-radius:4px;font-size:14px;font-family:'Poppins',sans-serif;outline:none;transition:border-color .2s;}
    .form-group input:focus,.form-group select:focus{border-color:#e60000;}
    .order-summary-card{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:8px;padding:24px;position:sticky;top:90px;}
    .os-title{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e0e0e0;}
    .os-item{display:flex;gap:12px;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f0f0f0;}
    .os-item:last-of-type{border-bottom:none;}
    .os-img{width:54px;height:54px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;}
    .os-img img{width:50px;height:50px;object-fit:contain;display:block;}
    .os-qty-badge{position:absolute;top:-6px;right:-6px;background:#e60000;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .os-info{flex:1;font-size:13px;}
    .os-name{font-weight:600;color:#1a1a1a;line-height:1.3;}
    .os-price{color:#e60000;font-weight:700;margin-top:2px;}
    .os-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;color:#555;}
    .os-row.total{font-size:16px;font-weight:700;color:#1a1a1a;padding-top:10px;border-top:2px solid #e0e0e0;margin-top:4px;}
    .btn-place-order{width:100%;padding:16px;background:#28a745;color:#fff;border:none;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;border-radius:4px;cursor:pointer;margin-top:16px;letter-spacing:.5px;}
    .btn-place-order:hover{background:#218838;}
    .secure-badge{text-align:center;font-size:12px;color:#999;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
    @media(max-width:900px){.checkout-layout{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}}
    @media(max-width:768px){
      .checkout-section{padding:18px;}
      .order-summary-card{position:static;padding:18px;}
    }
  </style>
</head>
<body>
<div id="site-header"></div>

<div style="background:#1a1a1a;color:#fff;padding:20px 0">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <a href="index.html" style="display:flex;align-items:center">
      <svg width="140" height="34" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="20" fill="#1a1a1a" stroke="#e60000" stroke-width="3"/>
        <circle cx="24" cy="24" r="12" fill="none" stroke="#999" stroke-width="4"/>
        <circle cx="24" cy="24" r="4" fill="#e60000"/>
        <text x="52" y="20" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="16" fill="#fff">DOUBLE COIN</text>
        <text x="52" y="38" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="16" fill="#e60000">WAREHOUSE</text>
      </svg>
    </a>
    <div style="display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap">
      <span style="color:#28a745">&#128274; Secure Checkout</span>
      <a href="cart.html" style="color:#aaa">&#8592; Back to Cart</a>
    </div>
  </div>
</div>

<div class="section" style="padding:36px 0 60px;background:#f5f5f5">
  <div class="container">
    <div class="checkout-layout">
      <div>
        <!-- Contact -->
        <div class="checkout-section">
          <h2><span class="step-num">1</span>Contact Information</h2>
          <div class="form-row single"><div class="form-group"><label>Email Address</label><input type="email" placeholder="you@example.com"/></div></div>
          <div class="form-row"><div class="form-group"><label>First Name</label><input type="text" placeholder="John"/></div><div class="form-group"><label>Last Name</label><input type="text" placeholder="Doe"/></div></div>
          <div class="form-row single"><div class="form-group"><label>Phone Number</label><input type="tel" placeholder="(555) 000-0000"/></div></div>
        </div>

        <!-- Shipping -->
        <div class="checkout-section">
          <h2><span class="step-num">2</span>Shipping Address</h2>
          <div class="form-row single"><div class="form-group"><label>Address Line 1</label><input type="text" placeholder="123 Main Street"/></div></div>
          <div class="form-row single"><div class="form-group"><label>Address Line 2 (optional)</label><input type="text" placeholder="Apt, Suite, Unit, etc."/></div></div>
          <div class="form-row"><div class="form-group"><label>City</label><input type="text" placeholder="City"/></div><div class="form-group"><label>State</label><select><option value="">Select State</option><option>Alabama</option><option>Alaska</option><option>Arizona</option><option>Arkansas</option><option>California</option><option>Colorado</option><option>Connecticut</option><option>Delaware</option><option>Florida</option><option>Georgia</option><option>Idaho</option><option>Illinois</option><option>Indiana</option><option>Iowa</option><option>Kansas</option><option>Kentucky</option><option>Louisiana</option><option>Maine</option><option>Maryland</option><option>Massachusetts</option><option>Michigan</option><option>Minnesota</option><option>Mississippi</option><option>Missouri</option><option>Montana</option><option>Nebraska</option><option>Nevada</option><option>New Hampshire</option><option>New Jersey</option><option>New Mexico</option><option>New York</option><option>North Carolina</option><option>North Dakota</option><option>Ohio</option><option>Oklahoma</option><option>Oregon</option><option>Pennsylvania</option><option>Rhode Island</option><option>South Carolina</option><option>South Dakota</option><option>Tennessee</option><option>Texas</option><option>Utah</option><option>Vermont</option><option>Virginia</option><option>Washington</option><option>West Virginia</option><option>Wisconsin</option><option>Wyoming</option></select></div></div>
          <div class="form-row"><div class="form-group"><label>ZIP Code</label><input type="text" placeholder="00000"/></div><div class="form-group"><label>Country</label><select><option>United States</option></select></div></div>
        </div>

        <!-- Additional Info -->
        <div class="checkout-section">
          <h2><span class="step-num">3</span>Additional Information</h2>
          <div class="form-row single"><div class="form-group"><label>Company Name (optional)</label><input type="text" placeholder="Your company name"/></div></div>
          <div class="form-row single"><div class="form-group"><label>Order Notes (optional)</label><textarea style="padding:11px 13px;border:1px solid #ddd;border-radius:4px;font-size:14px;font-family:'Poppins',sans-serif;outline:none;resize:vertical;min-height:80px;" placeholder="Any special instructions or notes for your order..."></textarea></div></div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary-card">
        <div class="os-title">Order Summary</div>
        <div id="osSummaryItems"></div>
        <div class="os-row"><span>Subtotal</span><span id="osSubtotal">$0.00</span></div>
        <div class="os-row"><span>Shipping</span><span id="osShipping">—</span></div>
        <div class="os-row total"><span>Total</span><span id="osTotal">$0.00</span></div>
        <button class="btn-place-order" onclick="placeOrder()">Submit Order Request</button>
        <p style="text-align:center;font-size:12px;color:#999;margin-top:12px">Our team will contact you to confirm your order and arrange payment.</p>
      </div>
    </div>
  </div>
</div>

<script src="components.js"></script>
<script src="products.generated.js"></script><script src="products.js"></script>

<script src="script.js"></script>
<script>
function initPage() {
  const items = document.getElementById('osSummaryItems');
  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const shipping = subtotal>=500?0:49.99;
  items.innerHTML = cart.map(i=>{
    const product = catalogProductForCart(i);
    const image = i.image || product?.image;
    return `
    <div class="os-item">
      <div class="os-img">
        ${image ? `<img src="${image}" alt="${i.brand} ${i.name}" loading="lazy" />` : '<svg width="36" height="36" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#1a1a1a"/><circle cx="32" cy="32" r="16" fill="none" stroke="#555" stroke-width="6"/><circle cx="32" cy="32" r="5" fill="#e60000"/></svg>'}
        <div class="os-qty-badge">${i.qty}</div>
      </div>
      <div class="os-info">
        <div class="os-name">${i.brand} ${i.name}</div>
        <div class="os-price">$${(i.price*i.qty).toFixed(2)} · Qty ${i.qty}</div>
      </div>
    </div>`;
  }).join('') || '<p style="font-size:13px;color:#999">No items in cart.</p>';
  document.getElementById('osSubtotal').textContent='$'+subtotal.toFixed(2);
  document.getElementById('osShipping').textContent=shipping===0?'FREE':'$'+shipping.toFixed(2);
  document.getElementById('osTotal').textContent='$'+(subtotal+shipping).toFixed(2);
}

async function placeOrder() {
  if(!cart.length){showToast('Your cart is empty.');return;}
  const inputs=document.querySelectorAll('.checkout-section input,.checkout-section select,.checkout-section textarea');
  const email=inputs[0]?.value.trim();
  const firstName=inputs[1]?.value.trim();
  const lastName=inputs[2]?.value.trim();
  const phone=inputs[3]?.value.trim();
  if(!email||!firstName||!lastName){showToast('Please fill in your contact information.');return;}
  const address1=inputs[4]?.value.trim();
  const address2=inputs[5]?.value.trim();
  const city=inputs[6]?.value.trim();
  const state=inputs[7]?.value;
  const zip=inputs[8]?.value.trim();
  if(!address1||!city||!state||!zip){showToast('Please fill in your shipping address.');return;}
  const company=inputs[10]?.value.trim()||'';
  const notes=document.querySelector('.checkout-section textarea')?.value.trim()||'';
  const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const shipping=subtotal>=500?0:49.99;
  const itemsHtml=cart.map(i=>'<tr><td style="padding:6px;border-bottom:1px solid #eee">'+i.brand+' '+i.name+'</td><td style="padding:6px;border-bottom:1px solid #eee">'+i.qty+'</td><td style="padding:6px;border-bottom:1px solid #eee">$'+(i.price*i.qty).toFixed(2)+'</td></tr>').join('');
  const adminBody='<h2>New Order Request</h2>'+
    '<h3>Contact</h3>'+
    '<p><strong>Name:</strong> '+firstName+' '+lastName+'</p>'+
    '<p><strong>Email:</strong> '+email+'</p>'+
    '<p><strong>Phone:</strong> '+(phone||'Not provided')+'</p>'+
    (company?'<p><strong>Company:</strong> '+company+'</p>':'')+
    '<h3>Shipping Address</h3>'+
    '<p>'+address1+(address2?', '+address2:'')+'<br>'+city+', '+state+' '+zip+'</p>'+
    '<h3>Items Ordered</h3>'+
    '<table style="border-collapse:collapse;width:100%"><tr><th style="text-align:left;padding:6px;border-bottom:2px solid #333">Item</th><th style="text-align:left;padding:6px;border-bottom:2px solid #333">Qty</th><th style="text-align:left;padding:6px;border-bottom:2px solid #333">Total</th></tr>'+itemsHtml+'</table>'+
    '<p style="margin-top:12px"><strong>Subtotal:</strong> $'+subtotal.toFixed(2)+'</p>'+
    '<p><strong>Shipping:</strong> '+(shipping===0?'FREE':'$'+shipping.toFixed(2))+'</p>'+
    '<p><strong>Total:</strong> $'+(subtotal+shipping).toFixed(2)+'</p>'+
    (notes?'<h3>Order Notes</h3><p>'+notes.replace(/\n/g,'<br>')+'</p>':'')+
    '<p style="margin-top:16px;color:#999;font-size:12px">Submitted: '+new Date().toLocaleString()+'</p>';
  const customerBody='<div style="max-width:600px;margin:0 auto;font-family:Arial,sans-serif">'+
    '<div style="background:#1a1a1a;padding:24px;text-align:center"><h1 style="color:#fff;margin:0;font-size:22px">Double Coin Heavy Duty Truck Warehouse</h1></div>'+
    '<div style="padding:28px;background:#fff">'+
    '<h2 style="color:#1a1a1a;margin-top:0">Thank you for your order, '+firstName+'!</h2>'+
    '<p style="color:#555;font-size:14px;line-height:1.7">We have received your order request and our team will contact you shortly to confirm the details and arrange payment.</p>'+
    '<h3 style="color:#1a1a1a;border-bottom:1px solid #eee;padding-bottom:8px">Order Summary</h3>'+
    '<table style="border-collapse:collapse;width:100%"><tr><th style="text-align:left;padding:8px;border-bottom:2px solid #333;font-size:13px">Item</th><th style="text-align:left;padding:8px;border-bottom:2px solid #333;font-size:13px">Qty</th><th style="text-align:left;padding:8px;border-bottom:2px solid #333;font-size:13px">Total</th></tr>'+itemsHtml+'</table>'+
    '<p style="margin-top:14px;font-size:14px"><strong>Subtotal:</strong> $'+subtotal.toFixed(2)+'</p>'+
    '<p style="font-size:14px"><strong>Shipping:</strong> '+(shipping===0?'FREE':'$'+shipping.toFixed(2))+'</p>'+
    '<p style="font-size:16px;font-weight:700;color:#e60000"><strong>Total:</strong> $'+(subtotal+shipping).toFixed(2)+'</p>'+
    '<h3 style="color:#1a1a1a;border-bottom:1px solid #eee;padding-bottom:8px">Shipping To</h3>'+
    '<p style="font-size:14px;color:#555">'+firstName+' '+lastName+'<br>'+address1+(address2?', '+address2:'')+'<br>'+city+', '+state+' '+zip+'</p>'+
    '<hr style="border:none;border-top:1px solid #eee;margin:24px 0">'+
    '<p style="font-size:13px;color:#999">If you have any questions, contact us at <a href="tel:7184315752" style="color:#e60000">(718) 431-5752</a> or reply to this email.</p>'+
    '</div>'+
    '<div style="background:#f5f5f5;padding:16px;text-align:center;font-size:12px;color:#999">&copy; 2026 Double Coin Heavy Duty Truck Warehouse. All rights reserved.</div>'+
    '</div>';
  // Disable button and show sending state
  const btn=document.querySelector('.btn-place-order');
  if(btn){btn.disabled=true;btn.textContent='Submitting Order...';}
  try {
    await Promise.all([
      sendEmail('trucktireswarehouse@gmail.com','New Order Request from '+firstName+' '+lastName,adminBody),
      sendEmail('info@doublecoins-heavyduty.com','New Order Request from '+firstName+' '+lastName,adminBody),
      sendEmail(email,'Order Confirmation - Double Coin Heavy Duty Truck Warehouse',customerBody)
    ]);
  } catch(e) { console.log('Email send error:', e.message); }
  cart=[];saveCart();
  document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:80vh;text-align:center;font-family:Poppins,sans-serif"><div><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg><h1 style="font-size:28px;margin:20px 0 10px;color:#1a1a1a">Order Request Submitted!</h1><p style="color:#666;font-size:15px;margin-bottom:28px">Thank you! Our team will contact you shortly to confirm your order and arrange payment.</p><a href="index.html" style="background:#e60000;color:#fff;padding:13px 30px;border-radius:4px;font-weight:700;text-decoration:none;font-size:14px">Back to Home</a></div></div>';
}
</script>
</body>
</html>
